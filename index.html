<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poker Range Trainer</title>
    <style>
      body { font-family: -apple-system, system-ui, Arial, sans-serif; padding: 16px; }
      pre { background: #111; color: #0f0; padding: 12px; border-radius: 8px; overflow: auto; }
      button { padding: 12px 14px; font-size: 16px; border-radius: 10px; }
    </style>
  </head>
  <body>
    <h1>Poker Range Trainer</h1>
    <p>If you see your BTN open range below, the JSON is loading correctly.</p>
    <button id="load">Load Range JSON</button>
    <pre id="out">Click "Load Range JSON"</pre>

    <script>
      const rangeData = {
        "format": "cash",
        "players": "6max",
        "stack_bb": 100,
        "ranges": {
          "open": {
            "BTN": {
              "raise": [
                "22+","A2s+","K2s+","Q5s+","J7s+","T7s+","97s+",
                "87s","76s","65s","54s",
                "A2o+","K7o+","Q9o+","J9o+","T9o"
              ],
              "call": [],
              "fold": []
            }
          }
        }
      };

      const out = document.getElementById("out");
      document.getElementById("load").addEventListener("click", () => {
        out.textContent = JSON.stringify(rangeData.ranges.open.BTN.raise, null, 2);
      });
    </script>
  </body>
</html>
